name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  # schedule:
  #   - cron: 0 20 * * *


jobs:
  build_linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: false

      - uses: mymindstorm/setup-emsdk@v14

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Build hot reload
        run: ./build_hot_reload.sh

      - name: Build release
        run: ./build_release.sh

      - name: Build debug
        run: ./build_debug.sh

      # - name: Build web
      #   run: ./build_web.sh

